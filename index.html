<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mi Galería de Imágenes</h1>
            <p>Bienvenido a mi portafolio</p>
        </header>

        <main>
            <section class="gallery">
                <div class="gallery-item">
                    <img src="images/image1.jpg" alt="Imagen 1">
                    <p>Imagen 1</p>
                </div>
                <div class="gallery-item">
                    <img src="images/image2.jpg" alt="Imagen 2">
                    <p>Imagen 2</p>
                </div>
                <div class="gallery-item">
                    <img src="images/image3.jpg" alt="Imagen 3">
                    <p>Imagen 3</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Mi Portafolio. Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
